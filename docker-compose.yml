services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voc-market-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=mysql://${DB_USER:-voc_user}:${DB_PASSWORD:-voc_secret_2026}@mysql:3306/${DB_NAME:-voc_market}
      - SESSION_COOKIE_NAME=voc_session
      - SESSION_TTL_DAYS=30
      - SEED_ON_INIT=${SEED_ON_INIT:-true}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - voc_uploads:/app/public/uploads
    networks:
      - voc_network

  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    container_name: voc-market-mysql
    restart: unless-stopped
    command:
      - --default-authentication-plugin=caching_sha2_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret_2026}
      MYSQL_DATABASE: ${DB_NAME:-voc_market}
      MYSQL_USER: ${DB_USER:-voc_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-voc_secret_2026}
    ports:
      - "${DB_PORT:-13306}:3306"
    volumes:
      - voc_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u $$MYSQL_USER --password=$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks:
      - voc_network

volumes:
  voc_db_data:
    name: voc_market_db_data
  voc_uploads:
    name: voc_market_uploads

networks:
  voc_network:
    name: voc_market_network
    driver: bridge

